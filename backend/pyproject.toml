[project]
name = "ratatosk"
version = "0.1.0"
description = "A universal and self heberged orchestrator"
readme = "../README.md"
authors = [
    { name = "Ph4nt0m1882", email = "aymeric.ts@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx-sse>=0.4.3",
    "httpx[http2]>=0.28.1",
    "orjson>=3.12.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scalar-fastapi>=1.9.1",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ratatosk = "ratatosk.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
