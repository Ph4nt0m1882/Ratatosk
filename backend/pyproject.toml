[project]
name = "ratatosk"
version = "0.1.0"
description = "The universal and customizable AI orchestrator that unifies models and combines their skills."
readme = "../README.md"
license = { text = "MIT" }
authors = [
    { name = "Ph4nt0m1882", email = "aymeric.ts@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "scalar-fastapi>=1.9.0",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ratatosk = "ratatosk:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
